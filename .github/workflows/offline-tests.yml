name: 离线安全测试
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      EPIC7_REQUIRE_GUI_TESTS: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装固定版本依赖（优先直连）
        run: python -B -X utf8 install_dependencies.py
      - name: 离线测试（禁止游戏输入，校验界面依赖）
        run: python -B -X utf8 run_offline_tests.py -v
